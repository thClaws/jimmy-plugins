# slide-render — Marp + Chromium slide renderer.
# Deployed to the thclaws-cloud namespace; reached in-cluster at
#   http://slide-render.thclaws-cloud.svc.cluster.local:8080
# The engine's RenderSlides tool points SLIDE_RENDER_API here (or the
# gateway proxies /slide-render/* to this Service). No public Ingress —
# renders untrusted decks, so keep it cluster-internal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slide-render
  namespace: thclaws-cloud
  labels: { app: slide-render }
spec:
  # Baseline only — the HPA below owns `replicas` once it is applied, so
  # do not tune this number by hand after the first apply.
  replicas: 1
  selector:
    matchLabels: { app: slide-render }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: slide-render }
    spec:
      # Matches the image's USER. Declared here too so the cluster refuses to
      # start it as root if the image is ever rebuilt without the USER line.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: slide-render
          # Tags are never reused. v0.1.0, v0.1.1, v0.2.0, v0.3.0 and v0.4.0 all exist
          # in the registry already — check `/v2/slide-render/tags/list` before
          # bumping, because pushing over a live tag swaps the code under a
          # running pod on its next restart with nothing in git to explain it.
          image: registry.artech.cloud/slide-render:v0.5.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # SLIDE_RENDER_TOKEN unset → auth is enforced upstream (gateway).
          resources:
            # Headroom for /pptx: LibreOffice peaks around 700MB-1GB on a
            # slide-heavy deck and can land while Chromium is still resident
            # from a /slides render. The upload itself streams to disk (multer
            # diskStorage) rather than the heap, so a 200MB deck costs /tmp,
            # not RAM — but /tmp is the container filesystem, hence the
            # ephemeral-storage request below.
            requests: { cpu: "250m", memory: "512Mi", ephemeral-storage: "2Gi" }
            limits: { cpu: "2000m", memory: "3Gi", ephemeral-storage: "8Gi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            # Chromium OOMs on the default 64MB /dev/shm; back it with RAM.
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: slide-render
  namespace: thclaws-cloud
  labels: { app: slide-render }
spec:
  selector: { app: slide-render }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Horizontal scaling. Every render is self-contained — the handler makes
# its own temp dir and removes it in `finally`, and nothing is shared
# between requests — so the Service can fan out over any number of pods
# with no session affinity and no shared volume.
#
# CPU is the right signal: a render is Chromium (or LibreOffice) pinning
# a core for ~1s per page, so queueing shows up as sustained CPU long
# before memory moves. The 60% target leaves headroom for the burst that
# arrives while a new pod is still pulling its (large) image.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: slide-render
  namespace: thclaws-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: slide-render
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      # Renders arrive in bursts (a whole book's chapters at once), so
      # add capacity fast; the image is big, and waiting a full minute
      # between steps means the burst is over before help arrives.
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      # Slow down: a half-finished 120s render dies with its pod.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
---
# A render can take up to TIMEOUT_MS (120s). Without this, a scale-down
# or a node drain can kill a pod mid-render and the caller gets a 502
# after already being billed nothing (the debit only lands on 2xx).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: slide-render
  namespace: thclaws-cloud
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: slide-render }
